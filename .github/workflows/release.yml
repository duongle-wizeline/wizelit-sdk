name: Publish to PyPI

on:
  push:
    tags:
      - "v*" # Trigger the workflow when a tag starting with 'v' is pushed (e.g., v1.0.2)

jobs:
  build-n-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest

    permissions:
      # This permission is REQUIRED for Trusted Publishing
      id-token: write
      contents: read

    environment:
      # This should match the environment name you set in PyPI (usually "pypi")
      name: pypi
      url: https://pypi.org/project/wizelit-sdk/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --upgrade pip uv

      - name: Build package
        run: make build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
